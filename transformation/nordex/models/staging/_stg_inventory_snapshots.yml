version: 2

models : 
  
 -  name: stg_inventory_snapshots
    description: 'Capture journalière du niveau de stock par SKU pour chaque site'
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - snapshot_date
              - site_id
              - sku
    columns: 
      - name: snapshot_date 
        description : 'Date de la capture'
        tests: 
          - not_null
      - name: site_id 
        description : 'Site concerné'
        tests: 
          - not_null
      - name: sku 
        description : 'Référence du produit'
        tests: 
          - not_null
